<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Chores - History</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Office Chore Manager</h1>
        </header>
        <nav>
            <a href="/">Today's Chores</a>
            <a href="/people">Manage People</a>
            <a href="/history">History</a>
        </nav>
        <div id="message-container"></div>
        <div class="card">
            <h2>Chore History Summary</h2>
            <p>Fairness is based on each member's all-time chore rate (chores done ÷ days attended).</p>
            <table>
                <thead>
                    <tr>
                        <th>Member Name</th>
                        <th>Chores This Week</th>
                        <th>Total Chores</th>
                        <th>Days Present</th>
                        <th>Chore Rate</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                </tbody>
            </table>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
