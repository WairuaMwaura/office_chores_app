<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Chores - Today</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Office Chore Manager</h1>
        </header>
        <nav>
            <a href="/">Today's Chores</a>
            <a href="/people">Manage People</a>
            <a href="/history">History</a>
        </nav>
        <div id="message-container"></div>

        <!-- Attendance + Assign -->
        <div class="card" id="attendance-card">
            <h2>Mark Attendance & Assign Chores</h2>
            <ul id="attendance-list"></ul>
            <button id="assign-chores-btn">Mark Attendance & Assign Chores</button>
        </div>

        <!-- Today's Assignments -->
        <div class="card" id="assignments-card" style="display:none;">
            <h2>Today's Assignments</h2>
            <p><strong>Cooks:</strong> <span id="cooks-list">—</span></p>
            <p><strong>Dish Washer:</strong> <span id="dishes-list">—</span></p>
        </div>

        <!-- Late Arrival Section (shown after chores assigned) -->
        <div class="card" id="late-arrival-card" style="display:none;">
            <h2>Mark Late Arrival</h2>
            <p>Someone arrived after chores were assigned? Record them here.</p>
            <div id="late-arrival-form">
                <select id="late-member-select">
                    <option value="">— Select member —</option>
                </select>
                <button id="check-late-btn">Check Options</button>
            </div>

            <!-- Options shown after checking -->
            <div id="late-arrival-options" style="display:none;">
                <p id="late-arrival-context"></p>
                <div id="late-arrival-actions"></div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
